name: noori
description: "Noori: Urdu Kids Stories. A bilingual English/Urdu read-along story app for ages 3-8."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_animate: ^4.5.2
  lottie: ^3.6.1
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  hive_flutter: ^1.1.0
  clock: ^1.1.2
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ">=4.2.0 <4.11.0"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/content/stories/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/ambient/
    # Recorded voices (see lib/core/audio/voice_clips.dart). A missing clip
    # is skipped; assets/audio/README.md explains where each file goes.
    - assets/audio/guide/en/
    - assets/audio/guide/ur/
    - assets/audio/stories/bunty_big_mango/en/
    - assets/audio/stories/bunty_big_mango/ur/
    - assets/audio/stories/chunnu_crosses_river/en/
    - assets/audio/stories/chunnu_crosses_river/ur/
    - assets/audio/stories/gulu_gentle_trunk/en/
    - assets/audio/stories/gulu_gentle_trunk/ur/
    - assets/audio/stories/mithu_tells_truth/en/
    - assets/audio/stories/mithu_tells_truth/ur/
    - assets/audio/stories/tolu_tiny_seed/en/
    - assets/audio/stories/tolu_tiny_seed/ur/
    - assets/audio/stories/ali_thirsty_sparrow/en/
    - assets/audio/stories/ali_thirsty_sparrow/ur/
    - assets/audio/stories/bunty_bismillah/en/
    - assets/audio/stories/bunty_bismillah/ur/
    - assets/audio/stories/dodo_tells_truth/en/
    - assets/audio/stories/dodo_tells_truth/ur/
    - assets/audio/stories/tippu_seed/en/
    - assets/audio/stories/tippu_seed/ur/
    - assets/audio/stories/hamza_salam/en/
    - assets/audio/stories/hamza_salam/ur/
    - assets/illustrations/characters/
    - assets/illustrations/props/
    - assets/illustrations/secrets/
    # Puppets: one folder per character, drawn by tool/gen_puppets.dart.
    - assets/illustrations/puppets/ali/
    - assets/illustrations/puppets/ammi/
    - assets/illustrations/puppets/ayesha/
    - assets/illustrations/puppets/baba/
    - assets/illustrations/puppets/bhalu/
    - assets/illustrations/puppets/bilal/
    - assets/illustrations/puppets/bunty/
    - assets/illustrations/puppets/chiku/
    - assets/illustrations/puppets/dodo/
    - assets/illustrations/puppets/hamza/
    - assets/illustrations/puppets/mithu/
    - assets/illustrations/puppets/nani/
    - assets/illustrations/puppets/sparrow/
    - assets/illustrations/puppets/squirrel/
    - assets/illustrations/puppets/tippu/
    - assets/illustrations/puppets/zainab/
    - assets/illustrations/scenes/mango_grove/
    - assets/illustrations/scenes/river_crossing/
    - assets/illustrations/scenes/jungle_nest/
    - assets/illustrations/scenes/flower_garden/
    - assets/illustrations/scenes/sunrise_farm/
    - assets/illustrations/scenes/skies/
    - assets/illustrations/scenes/hills/
    - assets/illustrations/scenes/rooftop/
    - assets/illustrations/scenes/orchard/
    - assets/illustrations/scenes/cave/
    - assets/illustrations/scenes/garden/
    - assets/illustrations/scenes/newhouse/
    - assets/illustrations/scenes/banyan/
    - assets/illustrations/scenes/bedroom/

  # Bundled variable fonts: the app never downloads anything.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf

# Launcher icons: `dart run flutter_launcher_icons` regenerates them.
# The inset keeps Noori's wings inside Android's round icon mask.
flutter_launcher_icons:
  image_path: PlayStore-assets/noori-playstore-512.png
  android: true
  adaptive_icon_background: PlayStore-assets/ic_launcher_background.png
  adaptive_icon_foreground: PlayStore-assets/noori-playstore-512.png
  adaptive_icon_foreground_inset: 10
  ios: true
  remove_alpha_ios: true
